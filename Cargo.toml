[package]
name = "mcommander"
version = "0.2.0"
edition = "2024"
description = "MCommander - a dual-pane file manager for Windows inspired by Total Commander"
license = "MIT"
repository = "https://github.com/Mad-Mange/MCommander"
readme = "README.md"
build = "build.rs"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
raw-window-handle = "0.6"
egui = "0.37"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp", "tiff"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
regex = "1"
notify = { version = "8", default-features = false }
sha2 = "0.10"
sevenz-rust2 = "0.24"
tar = "0.4"
flate2 = "1"
lzma-rust2 = "0.23"
bzip2 = "0.6"
ruzstd = "0.9"
unrar = "0.5"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_NetworkManagement_WNet",
    "Win32_System_SystemInformation",
]

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
